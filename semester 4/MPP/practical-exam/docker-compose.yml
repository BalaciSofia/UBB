services:
  db:
    image: postgres:16-alpine
    container_name: teoria-transpiratiei-db
    environment:
      POSTGRES_DB: teoria_transpiratiei
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - teoria-transpiratiei-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teoria_transpiratiei"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: teoria-transpiratiei-app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/teoria_transpiratiei
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  teoria-transpiratiei-data:
